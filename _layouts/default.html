<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="logo" lang="en" href="{{ '/' | relative_url }}">YKM Studio</a>
    <nav>
      <a href="{{ '/games/' | relative_url }}"{% if page.nav == 'games' %} aria-current="page"{% endif %}>Games</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.nav == 'about' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.nav == 'contact' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
  </div>
</header>

<main class="wrap">
{{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>© {{ site.time | date: '%Y' }} YKM Studio · <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    <p class="footer-links">{% for g in site.data.games %}<a href="{{ '/' | append: g.slug | append: '/' | relative_url }}">{{ g.name }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}</p>
  </div>
</footer>
</body>
</html>
